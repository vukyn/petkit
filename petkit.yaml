# petkit — what a machine should have, and where each piece goes.
#
# `petkit sync` makes ~/.claude match this file by SYMLINK: the repository is the
# only copy, and editing a skill here is the same as editing the installed one.
#
# ⚠️ Every path is relative to the repository root; every target may use ~ for the
# home directory and nothing else. An absolute target is refused — it would make
# this file machine-specific, which is the one thing it may not be.

version: 1

items:
  - id: skill/writing-todo
    kind: skill
    source: skills/writing-todo
    target: ~/.claude/skills/writing-todo
    note: |
      Writes and maintains a repository's TODO.md as a coded index of open work.
      Not provided by any plugin — this repository is its only home.

  - id: skill/todo-checklist
    kind: skill
    source: skills/todo-checklist
    target: ~/.claude/skills/todo-checklist
    note: |
      Personal. Writes checklists as .todo files in Todo+ format — smoke tests,
      release sign-offs, QA sheets — rather than printing them to a console.

# ── What is deliberately NOT here ────────────────────────────────────────────
#
# The test an item has to pass is one question: **who else writes this file?**
# If anything does, the item does not belong here — a second copy of a file that
# already has an owner is not a backup, it is a fork nobody is watching.
#
# Three kinds fail that test, and all three were found in a real skills directory
# when this manifest was first written:
#
#   1. A skill a PLUGIN already provides. Fourteen directories were older copies
#      of an installed plugin's own skills — one of them missing a whole section
#      the plugin's copy carried, another 64K against the plugin's 92K. Tracking
#      them would fork something that updates itself.
#   2. A file another TOOL deploys. Three hook scripts were written by the tools
#      that install them; one stamps its own version number into the file. A copy
#      here would be overwritten by its real owner without a word.
#   3. A file a REPOSITORY owns. Agents, commands and scripts addressed relative
#      to their repository ($CLAUDE_PROJECT_DIR, a Makefile variable) arrive on
#      every machine with `git clone` and need nothing from here.
#
# ⚠️ Two of those fourteen were symlinks into another tool's directory, and one
# of the two was BROKEN — pointing at a path that did not exist. `petkit doctor`
# reports that shape; it does not repair it, because the link is not its item.
